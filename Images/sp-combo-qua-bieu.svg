<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="65" rx="95" ry="20" fill="#cbd5e1" opacity="0.6"/>
<!-- Hộp gỗ sang trọng đầy ắp Bò một nắng, Mực, Nước mắm -->
<rect x="-80" y="-45" width="160" height="95" rx="10" fill="#78350f" stroke="#ca8a04" stroke-width="3"/>
<rect x="-70" y="-35" width="40" height="75" rx="4" fill="#b91c1c"/> <!-- Bò 1 nắng -->
<rect x="-20" y="-35" width="35" height="75" rx="4" fill="#fb923c"/> <!-- Mực 1 nắng -->
<rect x="25" y="-35" width="45" height="75" rx="4" fill="#b45309"/> <!-- Nước mắm Gành Đỏ -->
<circle cx="0" cy="-45" r="16" fill="#dc2626"/> <!-- Nơ quà -->
<polygon points="-8,-45 0,-55 8,-45 0,-35" fill="#fef08a"/>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">QUÀ BIẾU ĐẶC BIỆT</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">SET QUÀ THƯỢNG HẠNG</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Set Quà Biếu Hồn Quê Xứ Nẫu</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>