<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="50" rx="80" ry="18" fill="#cbd5e1" opacity="0.7"/>
<!-- Thân mực ống dẻo thơm nướng vỉ -->
<path d="M 0 -70 C 40 -30 45 20 20 40 C 0 50 -20 40 -45 20 C -45 -30 0 -70 0 -70 Z" fill="#fed7aa"/>
<path d="M 0 -70 C 35 -30 40 15 15 35 C -5 45 -20 35 -40 15 C -40 -30 0 -70 0 -70 Z" fill="#ffedd5"/>
<!-- Cánh mực -->
<polygon points="0,-70 45,-40 15,-20" fill="#fdba74"/>
<polygon points="0,-70 -45,-40 -15,-20" fill="#fdba74"/>
<!-- Râu mực xoăn -->
<path d="M -15 40 Q -25 70 -10 85 M -5 42 Q 0 75 10 88 M 15 40 Q 25 72 20 85 M 5 40 Q -10 65 -25 75" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
<!-- Khía nướng xém vàng -->
<line x1="-25" y1="-10" x2="25" y2="-10" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="4,3"/>
<line x1="-30" y1="10" x2="30" y2="10" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="4,3"/>
<line x1="-20" y1="28" x2="20" y2="28" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">HẢI SẢN PHÚ YÊN</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">LOẠI 1 TUYỂN CHỌN</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Mực Một Nắng Tuy Hòa</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>