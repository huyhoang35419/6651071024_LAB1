<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="55" rx="95" ry="20" fill="#cbd5e1" opacity="0.6"/>
<!-- Hộp quà biếu cao cấp carton vàng kim -->
<rect x="-75" y="-55" width="150" height="100" rx="8" fill="#b45309"/>
<rect x="-70" y="-50" width="140" height="90" rx="5" fill="#d97706"/>
<rect x="-15" y="-55" width="30" height="100" fill="#fef08a"/>
<rect x="-75" y="-10" width="150" height="20" fill="#fef08a"/>
<!-- Nơ đỏ -->
<circle cx="0" cy="0" r="15" fill="#dc2626"/>
<text x="0" y="-20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#78350f" text-anchor="middle">QUÀ TẶNG XỨ NẪU</text>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">QUÀ BIẾU CAO CẤP</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">HỘP QUÀ SANG TRỌNG</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Bò Một Nắng Hộp Quà Biếu</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>