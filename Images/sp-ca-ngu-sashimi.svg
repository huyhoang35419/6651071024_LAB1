<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="40" rx="95" ry="20" fill="#cbd5e1" opacity="0.6"/>
<rect x="-85" y="-15" width="170" height="50" rx="10" fill="#2d3748"/>
<!-- Khúc phi lê đỏ tươi -->
<path d="M -70 -20 L 50 -45 L 75 0 L -45 25 Z" fill="#e11d48"/>
<path d="M -70 -20 L -45 25 L -45 10 L -70 -35 Z" fill="#9f1239"/>
<path d="M -45 25 L 75 0 L 75 -15 L -45 10 Z" fill="#be123c"/>
<!-- Vân cá ngừ đại dương sọc dưa -->
<line x1="-50" y1="-10" x2="30" y2="-28" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
<line x1="-35" y1="5" x2="45" y2="-12" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
<line x1="-20" y1="18" x2="60" y2="2" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
<!-- Wasabi & chanh -->
<circle cx="65" cy="20" r="14" fill="#84cc16"/>
<circle cx="-60" cy="22" r="12" fill="#facc15"/>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">HẢI SẢN ĐẶC TRƯNG</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">CHUẨN SASHIMI</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Phi Lê Cá Ngừ Saku</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>