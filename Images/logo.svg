<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004e89"/>
      <stop offset="100%" stop-color="#002b49"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#fcbf49"/>
    </linearGradient>
  </defs>
  <!-- Icon: Lighthouse & Sea & Sun -->
  <g transform="translate(10, 5)">
    <circle cx="35" cy="35" r="32" fill="url(#oceanGrad)" />
    <!-- Sun -->
    <circle cx="48" cy="24" r="10" fill="url(#sunGrad)" opacity="0.9"/>
    <!-- Lighthouse / Tháp Nhạn shape -->
    <polygon points="30,55 40,55 38,22 32,22" fill="#ffffff" opacity="0.95"/>
    <polygon points="31,22 39,22 35,14" fill="#fcbf49"/>
    <rect x="33" y="28" width="4" height="6" fill="#004e89"/>
    <!-- Sea Waves -->
    <path d="M 12 50 Q 25 44 38 50 T 60 50" fill="none" stroke="#fcbf49" stroke-width="3" stroke-linecap="round"/>
    <path d="M 16 56 Q 28 52 42 56 T 56 56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Brand text -->
  <text x="85" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#004e89" letter-spacing="1">ĐẶC SẢN PHÚ YÊN</text>
  <text x="86" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e36414" letter-spacing="2">HỒN QUÊ XỨ NẪU • CHÍNH GỐC 100%</text>
  <rect x="85" y="66" width="220" height="2" fill="url(#sunGrad)" rx="1"/>
</svg>