<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="45" rx="80" ry="18" fill="#cbd5e1" opacity="0.6"/>
<!-- Hộp bánh bọc lá dừa xanh thắt nơ đỏ -->
<polygon points="0,-40 60,-15 0,10 -60,-15" fill="#15803d"/>
<polygon points="-60,-15 0,10 0,40 -60,15" fill="#166534"/>
<polygon points="60,-15 0,10 0,40 60,15" fill="#14532d"/>
<!-- Dây nơ đỏ tươi -->
<line x1="0" y1="-40" x2="0" y2="40" stroke="#ef4444" stroke-width="5"/>
<line x1="-60" y1="-15" x2="60" y2="-15" stroke="#ef4444" stroke-width="5"/>
<circle cx="0" cy="-15" r="8" fill="#dc2626"/>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">BÁNH KẸO & QUÀ VẶT</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">DẺO THƠM THANH MÁT</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Bánh Phu Thê (Xu Xê) Lá Dừa</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>