<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="45" rx="85" ry="18" fill="#cbd5e1" opacity="0.6"/>
<!-- Đĩa chả dông chiên cuốn ram vàng ươm -->
<ellipse cx="0" cy="15" rx="80" ry="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="-60" y="-20" width="50" height="20" rx="10" transform="rotate(-15 -35 -10)" fill="#d97706"/>
<rect x="-20" y="-30" width="55" height="20" rx="10" transform="rotate(10 10 -20)" fill="#b45309"/>
<rect x="15" y="-15" width="50" height="20" rx="10" transform="rotate(-8 40 -5)" fill="#ea580c"/>
<!-- Rau sống xà lách Phú Yên -->
<path d="M -50 15 C -40 -10 -20 20 0 10 C 20 5 40 -5 50 15" fill="#86efac" opacity="0.8"/>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">ĐẶC SẢN NÚI RỪNG</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">THƠM LỨNG GIÒN RỤM</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Chả Dông Tây Hòa Phú Yên</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>