<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="250" cy="230" r="170" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="250" cy="230" r="140" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Product Main Art / Graphics -->
  <g transform="translate(250, 230)">
    <ellipse cx="0" cy="45" rx="90" ry="20" fill="#cbd5e1" opacity="0.6"/>
<!-- Miếng bò tơ thớ dài nướng than đỏ -->
<polygon points="-75,-25 60,-40 80,15 10,40 -70,25" fill="#991b1b"/>
<polygon points="-65,-18 50,-32 70,12 5,32 -60,20" fill="#b91c1c"/>
<!-- Vệt cháy xém vàng thơm -->
<line x1="-50" y1="-15" x2="40" y2="-25" stroke="#7f1d1d" stroke-width="4" stroke-dasharray="10,5"/>
<line x1="-40" y1="5" x2="50" y2="-5" stroke="#7f1d1d" stroke-width="4" stroke-dasharray="12,6"/>
<line x1="-30" y1="20" x2="30" y2="15" stroke="#7f1d1d" stroke-width="4" stroke-dasharray="8,4"/>
<!-- Hũ muối kiến vàng bên cạnh -->
<g transform="translate(55, 10)">
  <rect x="-20" y="-25" width="40" height="45" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <rect x="-22" y="-30" width="44" height="8" rx="3" fill="#b45309"/>
  <!-- Hạt muối & kiến đen li ti -->
  <circle cx="-5" cy="-10" r="2" fill="#78350f"/><circle cx="5" cy="-8" r="1.5" fill="#78350f"/>
  <circle cx="0" cy="5" r="2" fill="#78350f"/><circle cx="-8" cy="10" r="1.5" fill="#78350f"/>
</g>
  </g>

  <!-- Tag Category -->
  <rect x="25" y="25" width="160" height="28" rx="14" fill="#004e89" opacity="0.9"/>
  <text x="105" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">ĐẶC SẢN NÚI RỪNG</text>

  <!-- Trust Badge -->
  <g transform="translate(350, 25)">
    <rect width="125" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="62" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">BÁN CHẠY NHẤT</text>
  </g>

  <!-- Bottom Info Panel -->
  <rect x="0" y="415" width="500" height="85" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="415" x2="500" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="250" y="448" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0f172a" text-anchor="middle">Bò Một Nắng Muối Kiến Vàng</text>
  <text x="250" y="474" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e36414" text-anchor="middle">★ CHÍNH HÃNG PHÚ YÊN • CẤP ĐÔNG 48H ★</text>
</svg>